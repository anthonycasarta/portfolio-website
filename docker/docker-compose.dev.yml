services:
  client:
    container_name: portfolio-web-client-dev
    build:
      context: ../client
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ../client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
